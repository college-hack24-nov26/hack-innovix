{% extends "staff/_shell.html" %}
{% block staff %}
<h1>Audit log</h1>
<table class="dense">
  <thead><tr><th>Time</th><th>User</th><th>Action</th><th>Resource</th><th>ID</th></tr></thead>
  <tbody>
    {% for log in logs %}
      <tr>
        <td>{{ log.created_at }}</td>
        <td>{{ log.user_id }}</td>
        <td>{{ log.action }}</td>
        <td>{{ log.resource_type }}</td>
        <td>{{ log.resource_id }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
