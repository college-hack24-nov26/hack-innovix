{% extends "base.html" %}
{% block content %}
<section class="auth-wrap">
  <div class="auth-card">
    <h1>{{ _('doctor_login') }}</h1>
    <form method="post" class="form">
      {{ form.hidden_tag() }}
      <label>{{ form.email.label }} {{ form.email(autocomplete="username") }}</label>
      <label>{{ form.password.label }} {{ form.password(autocomplete="current-password") }}</label>
      <button class="btn btn-primary" type="submit">{{ _('doctor_login') }}</button>
    </form>
    <p>New doctor? <a href="{{ url_for('auth.doctor_register') }}">Create a doctor account</a></p>
    <p><a href="{{ url_for('auth.login') }}">Patient login</a></p>
  </div>
</section>
{% endblock %}
